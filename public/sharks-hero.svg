<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Sharks Bot dashboard illustration</title>
  <desc id="desc">A modern dashboard mockup with a shark-inspired brand symbol and analytics cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#061a2a"/>
      <stop offset="100%" stop-color="#0d2d40"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
