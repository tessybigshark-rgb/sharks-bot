services:
  db:
    image: postgres:16-alpine
    container_name: sharks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharksbot
      POSTGRES_USER: sharks
      POSTGRES_PASSWORD: sharks123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharks -d sharksbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharks-bot
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      DATABASE_URL: postgres://sharks:sharks123@db:5432/sharksbot
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const port = process.env.PORT || 4000; fetch('http://localhost:' + port + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  python-worker:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: sharks-python
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://sharks:sharks123@db:5432/sharksbot
    volumes:
      - ./python:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
