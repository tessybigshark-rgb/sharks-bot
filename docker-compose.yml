services:
  db:
    image: postgres:16-alpine
    container_name: sharks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharksbot
      POSTGRES_USER: sharks
      POSTGRES_PASSWORD: sharks123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharks-bot
    depends_on:
      - db
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      DATABASE_URL: postgres://sharks:sharks123@db:5432/sharksbot
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    restart: unless-stopped

  python-worker:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: sharks-python
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://sharks:sharks123@db:5432/sharksbot
    volumes:
      - ./python:/app
    restart: unless-stopped

volumes:
  postgres_data:
